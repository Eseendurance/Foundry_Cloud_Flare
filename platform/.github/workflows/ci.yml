name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          # Dummy values so the build succeeds without real secrets.
          # Every route that needs a real key checks for it at request
          # time and fails with a clear message — none of them need the
          # key present just to compile.
          SITE_URL: https://example.com
