name: Deploy to Vercel (production)
#
# OPTIONAL. If you imported this repo at vercel.com/new, Vercel's own
# Git integration already deploys on every push to main — you almost
# certainly don't need this workflow too; having both just deploys
# twice. This exists for the case where you're deploying via the CLI
# instead of Vercel's GitHub integration (e.g. GitHub Enterprise Server,
# or you just want deploys to happen from Actions specifically).
#
# To use it: add three repo secrets (Settings → Secrets and variables →
# Actions) — VERCEL_TOKEN (vercel.com/account/tokens), VERCEL_ORG_ID and
# VERCEL_PROJECT_ID (both appear in .vercel/project.json after running
# `vercel link` locally once). Then remove the `if: false` guard below.

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: false # flip to true (or delete this line) once you've added the secrets above
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
